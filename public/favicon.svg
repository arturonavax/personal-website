<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="an-logo-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A352" />
      <stop offset="100%" stop-color="#D48B38" />
    </linearGradient>
    <linearGradient id="an-logo-garnet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B1E17" />
      <stop offset="100%" stop-color="#7A1C16" />
    </linearGradient>
    <style>
      .token-bg { fill: #120305; stroke: url(#an-logo-gold); }
      .token-text { fill: url(#an-logo-gold); }
      @media (prefers-color-scheme: light) {
        .token-bg { fill: #ffffff; stroke: url(#an-logo-garnet); }
        .token-text { fill: url(#an-logo-garnet); }
      }
    </style>
  </defs>

  <!-- Base circular token con margen de seguridad anti-recorte SEO (Google SERP circular mask) -->
  <circle
    cx="32"
    cy="32"
    r="29"
    class="token-bg"
    stroke-width="2.2"
  />

  <!-- Iniciales AN centradas óptica y geométricamente -->
  <text
    x="32"
    y="32"
    class="token-text"
    font-size="28"
    font-weight="700"
    font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
    text-anchor="middle"
    dominant-baseline="central"
  ><tspan letter-spacing="1.5px">A</tspan><tspan letter-spacing="0">N</tspan></text>
</svg>
