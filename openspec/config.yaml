# Current documentation entry point: openspec/specs/README.md
schema: spec-driven

context: |
  Source baseline: 418703353838524a963362b081869510022a53ae (2026-10-23).
  Stack: Astro 7.3.4 SSG, Cloudflare Workers + Static Assets/D1/R2, Tailwind 4.3.3, TypeScript 5.9.3, pnpm 12.5.1.
  Architecture: static directory documents with persistent client navigation and justified native JavaScript; ports/adapters for edge services.
  Current contracts: openspec/specs/README.md and current-*.md. SPEC-001 through SPEC-010 and odd/tasks*.md are historical records.
  Tests: Bun unit/integration suites plus Playwright browser suites; browser checks require a running server, browser and suitable content.
  Evidence: docs/verification.md distinguishes source assertions, runtime checks and production proof; no universal CWV/FPS or zero-cost certification.
  Content: editorial files/assets/CVs are private external inputs; never commit them or credential values.

# Preserve the existing strict-TDD switch; this documentation refresh does not
# change user workflow preferences. Follow applicable agent test-first policy.
strict_tdd: false

testing:
  strict_tdd: false
  detected: "2026-10-23"
  workspace_test_command: "pnpm test"
  projects:
    - path: "."
      stack: "Astro SSG, Cloudflare Workers, TypeScript"
      test_command: "pnpm test"
      framework: "Bun unit/integration; Playwright browser (separate local harness)"
      layers:
        unit: true
        integration: true
        e2e: true
      coverage_command: ""
      linter: "pnpm check"
      type_checker: "pnpm check"
      formatter: "pnpm format:check"

projects:
  - path: "."
    stack: "Astro SSG, Cloudflare Workers, TypeScript"
    test_command: "pnpm test"
    framework: "Bun; Playwright"
    coverage_command: ""
    lint_command: "pnpm check"
    typecheck_command: "pnpm check"
    format_command: "pnpm format:check"

rules:
  proposal:
    - Identify the affected current contract and behavioral evidence
    - Include rollback for risky changes; do not authorize remote operations implicitly
  specs:
    - Document current behavior with stable requirement IDs and Given/When/Then scenarios
    - Use RFC 2119 terms for intended invariants; mark implementation limitations separately
    - Link source and test evidence; do not claim unrun checks passed
  design:
    - Preserve persistent SPA rendering, route ownership and telemetry deduplication
    - Prefer minimal justified client JavaScript and existing typed ports/adapters
    - Separate provider limits, application budgets and measured performance
  tasks:
    - Keep tasks coherent and link them to current requirements
    - Distinguish implementation, local proof and owner-authorized production proof
  apply:
    guidelines:
      - Follow existing code patterns and current contracts
      - Keep Astro output static and preserve the admin boundary
      - Use strict typing for new code; avoid adding untyped escape hatches
      - Do not alter runtime behavior to make descriptive documentation appear correct
    tdd: false
    test_command: "pnpm test"
  verify:
    test_command: "pnpm test"
    build_command: "pnpm check && pnpm build"
    coverage_threshold: 0
  archive:
    - Preserve historical records and link the current contracts
    - Require explicit consent for destructive or remote operations
